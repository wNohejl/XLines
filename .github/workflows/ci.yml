name: CI

on:
  push:
    branches: [main, LineX_Development]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # Unit tests need no Docker: everything that reaches Postgres carries
      # [Trait("Category", "Integration")], and IntegrationTraitTests refuses a class without it.
      - name: Unit tests
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category!=Integration"
          --logger trx --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit

      # Integration tests start their own PostgreSQL via Testcontainers, using the
      # Docker daemon already present on the runner — no service container needed.
      - name: Integration tests
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category=Integration"
          --logger trx --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      # --no-build below means exactly that, so the build has to happen here. Without these two
      # steps the job failed on every run with "Assets file not found" — it was checking nothing
      # and reporting it in red.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Fails if an entity change was made without a matching migration — the most common
      # way a schema drifts away from its model between environments.
      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes --project src/XLines.Data --no-build
